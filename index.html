<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Final Rank Elite Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div class="header-left">

    <img src="178b6f3c-page-1.png" class="logo">
    <!-- LOGO HERE -->
    <!-- Later replace this comment with:
    <img src="your-logo.png" class="logo">
    -->
    
    <div class="title-group">
      <h1>FINAL RANK ELITE</h1>
      <p class="subtitle">ChessMood & Streamers Competitive Rankings</p>
    </div>
  </div>

  <div class="header-right">
    <div id="totalPrize" class="stat-box"></div>
    <div id="lastUpdated" class="stat-box"></div>
  </div>
</header>

<main>
  <section class="leaderboard-container">
    <div id="leaderboard"></div>
  </section>
</main>

<script>
const leaderboardURL = 'leaderboard.json';

async function loadLeaderboard() {
  try {
    const res = await fetch(leaderboardURL);
    if (!res.ok) throw new Error('Failed to fetch leaderboard JSON');
    const data = await res.json();

    const container = document.getElementById('leaderboard');
    container.innerHTML = '';

    const players = Object.values(data).sort((a, b) => {
      if ((b.totalEarnings || 0) !== (a.totalEarnings || 0))
        return (b.totalEarnings || 0) - (a.totalEarnings || 0);
      return a.username.localeCompare(b.username);
    });

    let totalDistributed = 0;

    players.forEach((player, i) => {
      totalDistributed += player.totalEarnings || 0;

      const card = document.createElement('div');
      card.classList.add('player-card');

      if (i === 0) card.classList.add('rank-1');
      if (i === 1) card.classList.add('rank-2');
      if (i === 2) card.classList.add('rank-3');

      card.innerHTML = `
        <div class="card-top">
          <div class="rank">#${i + 1}</div>
          <div class="username">${player.username}</div>
          <div class="total-earnings">$${player.totalEarnings?.toFixed(2) ?? '0.00'}</div>
        </div>

        <div class="tournament-panels">

          <div class="panel cm-panel">
            <h3>ChessMood</h3>
            <div class="panel-stats">
              <div>NetWins: <strong>${player.netWins_CM ?? 0}</strong></div>
              <div>Winrate: <strong>${player.winRate_CM != null ? (player.winRate_CM * 100).toFixed(1) + '%' : '0%'}</strong></div>
              <div>Earnings: <strong>$${player.earnings_CM?.toFixed(2) ?? '0.00'}</strong></div>
            </div>
          </div>

          <div class="panel st-panel">
            <h3>Streamers</h3>
            <div class="panel-stats">
              <div>NetWins: <strong>${player.netWins_ST ?? 0}</strong></div>
              <div>Winrate: <strong>${player.winRate_ST != null ? (player.winRate_ST * 100).toFixed(1) + '%' : '0%'}</strong></div>
              <div>Earnings: <strong>$${player.earnings_ST?.toFixed(2) ?? '0.00'}</strong></div>
            </div>
          </div>

        </div>
      `;

      container.appendChild(card);
    });

    document.getElementById('totalPrize').innerHTML =
      `<strong>Total Distributed:</strong> $${totalDistributed.toFixed(2)}`;

    document.getElementById('lastUpdated').innerHTML =
      `<strong>Last Updated:</strong> ${new Date().toLocaleString()}`;

  } catch (err) {
    document.querySelector('main').innerHTML =
      `<p style="color:red; text-align:center;">Failed to load leaderboard.</p>`;
  }
}

loadLeaderboard();
setInterval(loadLeaderboard, 5 * 60 * 1000);
</script>

</body>
</html>
