<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final-Rank-Elite Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Final-Rank-Elite Leaderboard</h1>
    <p>ChessMood & Streamers Tournament Rankings</p>
  </header>

  <main>
    <table id="leaderboard">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Username</th>
          <th>NetWins (CM)</th>
          <th>Winrate (CM)</th>
          <th>Earnings (CM)</th>
          <th>NetWins (ST)</th>
          <th>Winrate (ST)</th>
          <th>Earnings (ST)</th>
          <th>Total Earnings</th>
        </tr>
      </thead>
      <tbody>
        <!-- Player rows will be injected here -->
      </tbody>
    </table>
  </main>

  <script>
    // URL of the exported leaderboard JSON from admin site
    const leaderboardURL = 'leaderboard.json';

    async function loadLeaderboard() {
      try {
        const res = await fetch(leaderboardURL);
        if (!res.ok) throw new Error('Failed to fetch leaderboard JSON');
        const data = await res.json();

        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';

        // Sort by total earnings descending, then by username
        const sortedPlayers = Object.values(data).sort((a, b) => {
          if ((b.totalEarnings || 0) !== (a.totalEarnings || 0)) 
            return (b.totalEarnings || 0) - (a.totalEarnings || 0);
          return a.username.localeCompare(b.username);
        });

        sortedPlayers.forEach((player, i) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${i + 1}</td>
            <td>${player.username}</td>
            <td>${player.netWins_CM ?? 0}</td>
            <td>${player.winRate_CM != null ? (player.winRate_CM*100).toFixed(1) + '%' : '0%'}</td>
            <td>$${player.earnings_CM?.toFixed(2) ?? '0.00'}</td>
            <td>${player.netWins_ST ?? 0}</td>
            <td>${player.winRate_ST != null ? (player.winRate_ST*100).toFixed(1) + '%' : '0%'}</td>
            <td>$${player.earnings_ST?.toFixed(2) ?? '0.00'}</td>
            <td>$${player.totalEarnings?.toFixed(2) ?? '0.00'}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        document.querySelector('main').innerHTML = `<p style="color:red">Failed to load leaderboard.</p>`;
      }
    }

    loadLeaderboard();

    // Optional: auto-refresh every 5 minutes
    setInterval(loadLeaderboard, 5 * 60 * 1000);
  </script>
</body>
</html>
